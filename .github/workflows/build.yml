name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=1
        -Dfile.encoding=UTF-8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          fetch-depth: 0

      - name: Clean old published files
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE/builds" \
            -maxdepth 1 \
            -type f \
            \( -name "*.cs3" -o -name "*.jar" -o -name "plugins.json" \) \
            -delete

      - name: Detect Gradle modules
        id: detect_modules
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          MODULE_COUNT=0

          for module_dir in */; do
            if [ -f "${module_dir}build.gradle.kts" ] || \
               [ -f "${module_dir}build.gradle" ]; then
              echo "Detected module: ${module_dir%/}"
              MODULE_COUNT=$((MODULE_COUNT + 1))
            fi
          done

          echo "module_count=$MODULE_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "Tidak ada modul Gradle yang ditemukan."
            echo "Langkah Gradle akan dilewati dan artifact lama pada branch builds akan dibersihkan."
          else
            echo "Total modul terdeteksi: $MODULE_COUNT"
          fi

      - name: Setup JDK 17
        if: steps.detect_modules.outputs.module_count != '0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - name: Setup Android SDK
        if: steps.detect_modules.outputs.module_count != '0'
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Show Java and Android environment
        if: steps.detect_modules.outputs.module_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          echo "SDK Manager:"
          command -v sdkmanager || true
          sdkmanager --version || true

      - name: Show detected Gradle projects
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew projects \
            --no-daemon \
            --max-workers=1 \
            --console=plain \
            --stacktrace

      - name: Update optional Anoboy constants
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "Anoboy/update-constants.js" ]; then
            echo "Menjalankan Anoboy/update-constants.js"
            node Anoboy/update-constants.js
          else
            echo "Anoboy/update-constants.js tidak ditemukan; dilewati."
          fi

      - name: Verify TMDB credentials
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${TMDB_READ_ACCESS_TOKEN:-}" ]; then
            echo "TMDB_READ_ACCESS_TOKEN: PRESENT"
          else
            echo "TMDB_READ_ACCESS_TOKEN: MISSING"
          fi

          if [ -n "${TMDB_API_KEY:-}" ]; then
            echo "TMDB_API_KEY: PRESENT"
          else
            echo "TMDB_API_KEY: MISSING"
          fi

          TMDB_MODULES=$(
            grep -RIlE \
              --include='*.kt' --include='*.kts' --include='*.gradle' --include='ProviderProfile.json' \
              'TMDB_READ_ACCESS_TOKEN|TMDB_API_KEY|AgooseTmdbMetadata|"metadata"[[:space:]]*:' \
              . 2>/dev/null |
            sed -E 's#^\./([^/]+)/.*#\1#' |
            sort -u |
            tr '\n' ' ' || true
          )

          if [ -n "${TMDB_MODULES// /}" ]; then
            echo "TMDB-aware modules detected: $TMDB_MODULES"
          else
            echo "Tidak ada modul TMDB-aware yang terdeteksi secara statis."
          fi

          if [ -n "${TMDB_MODULES// /}" ] && \
             [ -z "${TMDB_READ_ACCESS_TOKEN:-}" ] && \
             [ -z "${TMDB_API_KEY:-}" ]; then
            echo "WARNING: Credential TMDB tidak tersedia untuk modul TMDB-aware."
            echo "Build tetap dilanjutkan; Agoose TMDB Standard mewajibkan fallback metadata provider/website."
          else
            echo "Credential TMDB tersedia atau tidak diperlukan oleh modul yang terdeteksi."
          fi

      - name: Validate ProviderProfile JSON
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPROFILE'
          import json
          from pathlib import Path

          required = {
              "schema",
              "provider",
              "websiteKey",
              "remote",
              "defaults",
              "endpoints",
              "selectors",
              "playback",
              "contentFilter",
          }
          object_fields = {
              "remote",
              "defaults",
              "endpoints",
              "selectors",
              "playback",
              "contentFilter",
          }
          description_policies = {
              "legacy_tmdb_preferred",
              "prefer_indonesian",
              "web_only",
              "tmdb_if_missing",
          }
          invalid_web_fallbacks = {"empty", "web"}
          validated = 0

          for module in sorted(path for path in Path(".").iterdir() if path.is_dir()):
              build = module / "build.gradle.kts"
              if not build.is_file():
                  build = module / "build.gradle"
              if not build.is_file():
                  continue

              profile = module / "config" / "ProviderProfile.json"
              build_text = build.read_text(encoding="utf-8", errors="ignore")
              expects_profile = "AGOOSE_PROVIDER_PROFILE_JSON" in build_text

              if expects_profile and not profile.is_file():
                  raise SystemExit(f"ProviderProfile required but missing: {profile}")

              if not profile.is_file():
                  continue

              try:
                  data = json.loads(profile.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid JSON: {profile}: {exc}") from exc

              if not isinstance(data, dict):
                  raise SystemExit(f"ProviderProfile root must be an object: {profile}")

              missing = sorted(required - set(data))
              if missing:
                  raise SystemExit(f"Invalid ProviderProfile: {profile}; missing={missing}")

              if data.get("schema") != "agoose-provider-profile-v1":
                  raise SystemExit(
                      f"Invalid ProviderProfile schema: {profile}; "
                      f"got={data.get('schema')!r}"
                  )

              for field in sorted(object_fields):
                  if not isinstance(data.get(field), dict):
                      raise SystemExit(
                          f"ProviderProfile field must be an object: "
                          f"{profile} -> {field}"
                      )

              if not isinstance(data.get("provider"), str) or not data["provider"].strip():
                  raise SystemExit(f"ProviderProfile provider must be non-empty: {profile}")

              if not isinstance(data.get("websiteKey"), str) or not data["websiteKey"].strip():
                  raise SystemExit(f"ProviderProfile websiteKey must be non-empty: {profile}")

              metadata = data.get("metadata")
              if metadata is not None:
                  if not isinstance(metadata, dict):
                      raise SystemExit(f"ProviderProfile metadata must be an object when present: {profile}")
                  tmdb = metadata.get("tmdb")
                  if tmdb is not None:
                      if not isinstance(tmdb, dict):
                          raise SystemExit(f"ProviderProfile metadata.tmdb must be an object: {profile}")
                      policy = tmdb.get("descriptionPolicy")
                      if policy is not None and policy not in description_policies:
                          raise SystemExit(
                              f"Invalid metadata.tmdb.descriptionPolicy: {profile}; got={policy!r}"
                          )
                      fallback = tmdb.get("invalidWebDescriptionFallback")
                      if fallback is not None and fallback not in invalid_web_fallbacks:
                          raise SystemExit(
                              f"Invalid metadata.tmdb.invalidWebDescriptionFallback: {profile}; got={fallback!r}"
                          )
                      quality = tmdb.get("descriptionQuality")
                      if quality is not None and not isinstance(quality, dict):
                          raise SystemExit(
                              f"ProviderProfile metadata.tmdb.descriptionQuality must be an object: {profile}"
                          )

                  description_filter = metadata.get("descriptionFilter")
                  if description_filter is not None:
                      if not isinstance(description_filter, dict):
                          raise SystemExit(f"ProviderProfile metadata.descriptionFilter must be an object: {profile}")
                      for key in ("boundaryMarkers", "stripPatterns", "invalidPatterns", "allowPatterns"):
                          value = description_filter.get(key, [])
                          if not isinstance(value, list):
                              raise SystemExit(f"ProviderProfile metadata.descriptionFilter.{key} must be an array: {profile}")
                          if len(value) > 64 or any(not isinstance(item, str) or not 2 <= len(item.strip()) <= 240 for item in value):
                              raise SystemExit(f"Invalid/bounded metadata.descriptionFilter.{key}: {profile}")
                      minimum = description_filter.get("minimumCleanLength", 40)
                      if not isinstance(minimum, int) or isinstance(minimum, bool) or not 20 <= minimum <= 500:
                          raise SystemExit(f"Invalid metadata.descriptionFilter.minimumCleanLength: {profile}; got={minimum!r}")

              print(f"ProviderProfile PASS: {profile}")
              validated += 1

          print(f"ProviderProfile files validated: {validated}")
          PYPROFILE

      - name: Verify Layarkaca21 generated TMDB BuildConfig
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail

          if [ ! -f "Layarkaca21/build.gradle.kts" ] && \
             [ ! -f "Layarkaca21/build.gradle" ]; then
            echo "Layarkaca21 tidak ada pada checkout ini; gate BuildConfig dilewati."
            exit 0
          fi

          echo "Generating fresh Layarkaca21 BuildConfig with TMDB environment..."
          ./gradlew \
            :Layarkaca21:clean \
            :Layarkaca21:generateDebugBuildConfig \
            --no-daemon \
            --max-workers=1 \
            --console=plain \
            --stacktrace

          python3 - <<'PYBUILDCONFIG'
          import os
          import re
          from pathlib import Path

          generated_root = Path("Layarkaca21/build/generated")
          candidates = sorted(
              p for p in generated_root.rglob("BuildConfig.*")
              if p.is_file()
          )

          selected = None
          text = None
          for path in candidates:
              candidate_text = path.read_text(encoding="utf-8", errors="ignore")
              if (
                  "TMDB_READ_ACCESS_TOKEN" in candidate_text
                  and "TMDB_API_KEY" in candidate_text
              ):
                  selected = path
                  text = candidate_text
                  break

          if selected is None or text is None:
              raise SystemExit(
                  "ERROR: Generated BuildConfig Layarkaca21 dengan field TMDB tidak ditemukan."
              )

          print(f"Generated BuildConfig detected: {selected}")

          def java_escape(value: str) -> str:
              return (
                  value.replace("\\", "\\\\")
                  .replace('"', '\\"')
                  .replace("\r", "\\r")
                  .replace("\n", "\\n")
                  .replace("\t", "\\t")
              )

          def generated_literal(name: str):
              match = re.search(
                  rf'\b{name}\s*=\s*"((?:\\.|[^"\\])*)"',
                  text,
              )
              return None if match is None else match.group(1)

          failures = []
          for name in ("TMDB_READ_ACCESS_TOKEN", "TMDB_API_KEY"):
              expected = os.environ.get(name, "")
              actual = generated_literal(name)

              if not expected:
                  status = "NOT_SET"
              elif actual is None:
                  status = "MISSING"
                  failures.append(name)
              elif actual == java_escape(expected):
                  status = "MATCH"
              else:
                  status = "MISMATCH"
                  failures.append(name)

              print(f"Generated BuildConfig {name}: {status}")

          if not os.environ.get("TMDB_READ_ACCESS_TOKEN", "") and not os.environ.get("TMDB_API_KEY", ""):
              raise SystemExit(
                  "ERROR: Layarkaca21 membutuhkan TMDB enrichment tetapi kedua credential tidak tersedia pada workflow."
              )

          if failures:
              raise SystemExit(
                  "ERROR: Generated BuildConfig tidak identik dengan credential GitHub Actions untuk: "
                  + ", ".join(failures)
              )

          print("Layarkaca21 generated TMDB BuildConfig gate: PASS")
          PYBUILDCONFIG

      - name: Build every detected module
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail

          MODULE_COUNT=0

          for module_dir in */; do
            if [ -f "${module_dir}build.gradle.kts" ] || \
               [ -f "${module_dir}build.gradle" ]; then

              module="${module_dir%/}"

              echo "========================================"
              echo "Building module: ${module}"
              echo "========================================"

              ./gradlew ":${module}:make" \
                --no-daemon \
                --max-workers=1 \
                --console=plain \
                --stacktrace

              MODULE_COUNT=$((MODULE_COUNT + 1))
            fi
          done

          echo "Total module berhasil dibuild: $MODULE_COUNT"

      - name: Generate plugins.json
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew makePluginsJson \
            --no-daemon \
            --max-workers=1 \
            --console=plain \
            --stacktrace

      - name: Collect publish files
        if: steps.detect_modules.outputs.module_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE/src" \
            -type f \
            -name "*.cs3" \
            -exec cp -f {} "$GITHUB_WORKSPACE/builds/" \;

          PLUGINS_JSON="$GITHUB_WORKSPACE/src/build/plugins.json"

          if [ ! -f "$PLUGINS_JSON" ]; then
            echo "ERROR: src/build/plugins.json tidak ditemukan."
            exit 1
          fi

          cp -f "$PLUGINS_JSON" \
            "$GITHUB_WORKSPACE/builds/plugins.json"

          echo "========================================"
          echo "File yang akan dipublikasikan"
          echo "========================================"

          find "$GITHUB_WORKSPACE/builds" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" |
            sort

          CS3_COUNT=$(
            find "$GITHUB_WORKSPACE/builds" \
              -maxdepth 1 \
              -type f \
              -name "*.cs3" |
            wc -l
          )

          JSON_COUNT=$(
            find "$GITHUB_WORKSPACE/builds" \
              -maxdepth 1 \
              -type f \
              -name "plugins.json" |
            wc -l
          )

          echo "Jumlah file .cs3: $CS3_COUNT"
          echo "Jumlah plugins.json: $JSON_COUNT"

          if [ "$CS3_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada file .cs3 yang dihasilkan."
            exit 1
          fi

          if [ "$JSON_COUNT" -ne 1 ]; then
            echo "ERROR: plugins.json tidak tersedia."
            exit 1
          fi

          echo "Isi plugins.json:"
          cat "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Publish builds branch
        working-directory: builds
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config \
            user.name \
            "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan hasil build."
            exit 0
          fi

          git commit -m "Build ${GITHUB_SHA}"
          git push origin HEAD:builds