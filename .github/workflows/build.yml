name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          fetch-depth: 0

      - name: Clean old published files
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE/builds" -maxdepth 1 -type f \
            \( -name "*.cs3" -o -name "*.jar" -o -name "plugins.json" \) \
            -delete

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Show detected Gradle projects
        working-directory: src
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew projects --no-daemon --console=plain

      - name: Update optional Anoboy constants
        working-directory: src
        shell: bash
        run: |
          if [ -f "Anoboy/update-constants.js" ]; then
            node Anoboy/update-constants.js
          else
            echo "Anoboy/update-constants.js tidak ditemukan; dilewati."
          fi

      - name: Build every detected module
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          MODULE_COUNT=0

          for module_dir in */; do
            if [ -f "${module_dir}build.gradle.kts" ] || [ -f "${module_dir}build.gradle" ]; then
              module="${module_dir%/}"
              echo "========================================"
              echo "Building module: ${module}"
              echo "========================================"

              ./gradlew ":${module}:make" \
                --no-daemon \
                --console=plain \
                --stacktrace

              MODULE_COUNT=$((MODULE_COUNT + 1))
            fi
          done

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada modul Gradle yang ditemukan."
            exit 1
          fi

          echo "Total module dibuild: $MODULE_COUNT"

      - name: Generate plugins.json
        working-directory: src
        shell: bash
        run: |
          ./gradlew makePluginsJson \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Collect publish files
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE/src" -type f -name "*.cs3" \
            -exec cp -f {} "$GITHUB_WORKSPACE/builds/" \;

          if [ ! -f "$GITHUB_WORKSPACE/src/build/plugins.json" ]; then
            echo "ERROR: src/build/plugins.json tidak ditemukan."
            exit 1
          fi

          cp -f "$GITHUB_WORKSPACE/src/build/plugins.json" \
            "$GITHUB_WORKSPACE/builds/plugins.json"

          echo "File yang akan dipublikasikan:"
          find "$GITHUB_WORKSPACE/builds" -maxdepth 1 -type f -printf "%f\n" | sort

          CS3_COUNT=$(find "$GITHUB_WORKSPACE/builds" -maxdepth 1 -type f -name "*.cs3" | wc -l)
          echo "Jumlah file .cs3: $CS3_COUNT"

          if [ "$CS3_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada file .cs3 yang dihasilkan."
            exit 1
          fi

      - name: Publish builds branch
        working-directory: builds
        shell: bash
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan hasil build."
            exit 0
          fi

          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:builds
