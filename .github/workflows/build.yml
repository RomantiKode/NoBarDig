name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=1
        -Dfile.encoding=UTF-8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          fetch-depth: 0

      - name: Clean old published files
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE/builds" \
            -maxdepth 1 \
            -type f \
            \( -name "*.cs3" -o -name "*.jar" -o -name "plugins.json" \) \
            -delete

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Show Java and Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          echo "SDK Manager:"
          command -v sdkmanager || true
          sdkmanager --version || true

      - name: Show detected Gradle projects
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew projects \
            --no-daemon \
            --max-workers=1 \
            --console=plain \
            --stacktrace

      - name: Update optional Anoboy constants
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "Anoboy/update-constants.js" ]; then
            echo "Menjalankan Anoboy/update-constants.js"
            node Anoboy/update-constants.js
          else
            echo "Anoboy/update-constants.js tidak ditemukan; dilewati."
          fi

      - name: Build every detected module
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          MODULE_COUNT=0

          for module_dir in */; do
            if [ -f "${module_dir}build.gradle.kts" ] || \
               [ -f "${module_dir}build.gradle" ]; then

              module="${module_dir%/}"

              echo "========================================"
              echo "Building module: ${module}"
              echo "========================================"

              ./gradlew ":${module}:make" \
                --no-daemon \
                --max-workers=1 \
                --console=plain \
                --stacktrace

              MODULE_COUNT=$((MODULE_COUNT + 1))
            fi
          done

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada modul Gradle yang ditemukan."
            exit 1
          fi

          echo "Total module berhasil dibuild: $MODULE_COUNT"

      - name: Generate plugins.json
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew makePluginsJson \
            --no-daemon \
            --max-workers=1 \
            --console=plain \
            --stacktrace

      - name: Collect publish files
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE/src" \
            -type f \
            -name "*.cs3" \
            -exec cp -f {} "$GITHUB_WORKSPACE/builds/" \;

          PLUGINS_JSON="$GITHUB_WORKSPACE/src/build/plugins.json"

          if [ ! -f "$PLUGINS_JSON" ]; then
            echo "ERROR: src/build/plugins.json tidak ditemukan."
            exit 1
          fi

          cp -f "$PLUGINS_JSON" \
            "$GITHUB_WORKSPACE/builds/plugins.json"

          echo "========================================"
          echo "File yang akan dipublikasikan"
          echo "========================================"

          find "$GITHUB_WORKSPACE/builds" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" |
            sort

          CS3_COUNT=$(
            find "$GITHUB_WORKSPACE/builds" \
              -maxdepth 1 \
              -type f \
              -name "*.cs3" |
            wc -l
          )

          JSON_COUNT=$(
            find "$GITHUB_WORKSPACE/builds" \
              -maxdepth 1 \
              -type f \
              -name "plugins.json" |
            wc -l
          )

          echo "Jumlah file .cs3: $CS3_COUNT"
          echo "Jumlah plugins.json: $JSON_COUNT"

          if [ "$CS3_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada file .cs3 yang dihasilkan."
            exit 1
          fi

          if [ "$JSON_COUNT" -ne 1 ]; then
            echo "ERROR: plugins.json tidak tersedia."
            exit 1
          fi

          echo "Isi plugins.json:"
          cat "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Publish builds branch
        working-directory: builds
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config \
            user.name \
            "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan hasil build."
            exit 0
          fi

          git commit -m "Build ${GITHUB_SHA}"
          git push origin HEAD:builds