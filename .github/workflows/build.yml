name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.workers.max=1
        -Dfile.encoding=UTF-8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          fetch-depth: 0

      - name: Clean old published files
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE/builds" \
            -maxdepth 1 \
            -type f \
            \( -name "*.cs3" -o -name "*.jar" -o -name "plugins.json" \) \
            -delete

      - name: Detect Gradle modules
        id: detect_modules
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          MODULE_COUNT=0

          for module_dir in */; do
            if [ -f "${module_dir}build.gradle.kts" ] || \
               [ -f "${module_dir}build.gradle" ]; then
              echo "Detected module: ${module_dir%/}"
              MODULE_COUNT=$((MODULE_COUNT + 1))
            fi
          done

          echo "module_count=$MODULE_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "Tidak ada modul Gradle yang ditemukan."
            echo "Langkah Gradle akan dilewati dan artifact lama pada branch builds akan dibersihkan."
          else
            echo "Total modul terdeteksi: $MODULE_COUNT"
          fi

      - name: Setup JDK 17
        if: steps.detect_modules.outputs.module_count != '0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - name: Setup Android SDK
        if: steps.detect_modules.outputs.module_count != '0'
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Show Java and Android environment
        if: steps.detect_modules.outputs.module_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          echo "Java version:"
          java -version

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          echo "SDK Manager:"
          command -v sdkmanager || true
          sdkmanager --version || true

      - name: Show detected Gradle projects
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew projects \
            --no-daemon \
            --max-workers=1 \
            --console=plain \
            --stacktrace

      - name: Update optional Anoboy constants
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "Anoboy/update-constants.js" ]; then
            echo "Menjalankan Anoboy/update-constants.js"
            node Anoboy/update-constants.js
          else
            echo "Anoboy/update-constants.js tidak ditemukan; dilewati."
          fi

      - name: Verify TMDB credentials
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${TMDB_READ_ACCESS_TOKEN:-}" ]; then
            echo "TMDB_READ_ACCESS_TOKEN: PRESENT"
          else
            echo "TMDB_READ_ACCESS_TOKEN: MISSING"
          fi

          if [ -n "${TMDB_API_KEY:-}" ]; then
            echo "TMDB_API_KEY: PRESENT"
          else
            echo "TMDB_API_KEY: MISSING"
          fi

          if [ -d "Layarkaca21" ] && \
             [ -z "${TMDB_READ_ACCESS_TOKEN:-}" ] && \
             [ -z "${TMDB_API_KEY:-}" ]; then
            echo "WARNING: Credential TMDB tidak tersedia."
            echo "Build tetap dilanjutkan; metadata akan memakai fallback provider/website."
          else
            echo "Credential TMDB tersedia atau tidak diperlukan oleh modul yang terdeteksi."
          fi

      - name: Validate ProviderProfile JSON
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPROFILE'
          import json
          from pathlib import Path

          required = {
              "schema",
              "provider",
              "websiteKey",
              "remote",
              "defaults",
              "endpoints",
              "selectors",
              "playback",
              "contentFilter",
          }
          object_fields = {
              "remote",
              "defaults",
              "endpoints",
              "selectors",
              "playback",
              "contentFilter",
          }
          validated = 0

          for module in sorted(path for path in Path(".").iterdir() if path.is_dir()):
              build = module / "build.gradle.kts"
              if not build.is_file():
                  build = module / "build.gradle"
              if not build.is_file():
                  continue

              profile = module / "config" / "ProviderProfile.json"
              build_text = build.read_text(encoding="utf-8", errors="ignore")
              expects_profile = "AGOOSE_PROVIDER_PROFILE_JSON" in build_text

              if expects_profile and not profile.is_file():
                  raise SystemExit(f"ProviderProfile required but missing: {profile}")

              if not profile.is_file():
                  continue

              try:
                  data = json.loads(profile.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid JSON: {profile}: {exc}") from exc

              if not isinstance(data, dict):
                  raise SystemExit(f"ProviderProfile root must be an object: {profile}")

              missing = sorted(required - set(data))
              if missing:
                  raise SystemExit(f"Invalid ProviderProfile: {profile}; missing={missing}")

              if data.get("schema") != "agoose-provider-profile-v1":
                  raise SystemExit(
                      f"Invalid ProviderProfile schema: {profile}; "
                      f"got={data.get('schema')!r}"
                  )

              for field in sorted(object_fields):
                  if not isinstance(data.get(field), dict):
                      raise SystemExit(
                          f"ProviderProfile field must be an object: "
                          f"{profile} -> {field}"
                      )

              if not isinstance(data.get("provider"), str) or not data["provider"].strip():
                  raise SystemExit(f"ProviderProfile provider must be non-empty: {profile}")

              if not isinstance(data.get("websiteKey"), str) or not data["websiteKey"].strip():
                  raise SystemExit(f"ProviderProfile websiteKey must be non-empty: {profile}")

              print(f"ProviderProfile PASS: {profile}")
              validated += 1

          print(f"ProviderProfile files validated: {validated}")
          PYPROFILE

      - name: Build every detected module
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail

          MODULE_COUNT=0

          for module_dir in */; do
            if [ -f "${module_dir}build.gradle.kts" ] || \
               [ -f "${module_dir}build.gradle" ]; then

              module="${module_dir%/}"

              echo "========================================"
              echo "Building module: ${module}"
              echo "========================================"

              ./gradlew ":${module}:make" \
                --no-daemon \
                --max-workers=1 \
                --console=plain \
                --stacktrace

              MODULE_COUNT=$((MODULE_COUNT + 1))
            fi
          done

          echo "Total module berhasil dibuild: $MODULE_COUNT"

      - name: Generate plugins.json
        if: steps.detect_modules.outputs.module_count != '0'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew makePluginsJson \
            --no-daemon \
            --max-workers=1 \
            --console=plain \
            --stacktrace

      - name: Collect publish files
        if: steps.detect_modules.outputs.module_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          find "$GITHUB_WORKSPACE/src" \
            -type f \
            -name "*.cs3" \
            -exec cp -f {} "$GITHUB_WORKSPACE/builds/" \;

          PLUGINS_JSON="$GITHUB_WORKSPACE/src/build/plugins.json"

          if [ ! -f "$PLUGINS_JSON" ]; then
            echo "ERROR: src/build/plugins.json tidak ditemukan."
            exit 1
          fi

          cp -f "$PLUGINS_JSON" \
            "$GITHUB_WORKSPACE/builds/plugins.json"

          echo "========================================"
          echo "File yang akan dipublikasikan"
          echo "========================================"

          find "$GITHUB_WORKSPACE/builds" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" |
            sort

          CS3_COUNT=$(
            find "$GITHUB_WORKSPACE/builds" \
              -maxdepth 1 \
              -type f \
              -name "*.cs3" |
            wc -l
          )

          JSON_COUNT=$(
            find "$GITHUB_WORKSPACE/builds" \
              -maxdepth 1 \
              -type f \
              -name "plugins.json" |
            wc -l
          )

          echo "Jumlah file .cs3: $CS3_COUNT"
          echo "Jumlah plugins.json: $JSON_COUNT"

          if [ "$CS3_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada file .cs3 yang dihasilkan."
            exit 1
          fi

          if [ "$JSON_COUNT" -ne 1 ]; then
            echo "ERROR: plugins.json tidak tersedia."
            exit 1
          fi

          echo "Isi plugins.json:"
          cat "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Publish builds branch
        working-directory: builds
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config \
            user.name \
            "github-actions[bot]"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan hasil build."
            exit 0
          fi

          git commit -m "Build ${GITHUB_SHA}"
          git push origin HEAD:builds